name: Unity Auto Formatter

on: [push, workflow_dispatch]

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2  # Needed if you want to amend the last commit (e.g. for squash commits)

      - name: C# Unity Auto Formatting
        uses: SilvaUnCompte/CS-Unity-Actions-Autoformat@v1.1.0
        with:
          path: ./Assets/Scripts/
          check_only: 'false'
          diff_check: 'false'
          check_severity: 'warn'
          squash_commit: 'true'
