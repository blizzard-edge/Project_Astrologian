name: Unity - Create

on:
  workflow_dispatch:

jobs:
  create:
    runs-on: windows-latest
    steps:
      - name: Unity - Create
        uses: jbltx/unity-create@v1.2
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          unityVersion: '2019.2.11f1'
          projectPath: ./myProject
