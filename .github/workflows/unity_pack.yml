name: Unity Pack

on:
  workflow_dispatch:

jobs:
  unity-pack:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unity Pack
        uses: quabug/unity-pack@v2
        with:
          package-dir: '' # Required directory path relative to the Unity project directory
          output-path: '' # Path of the .unitypackage file
          project-dir: '' # Directory of the Unity project
